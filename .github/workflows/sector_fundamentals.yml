name: Sector agent - fundamentals capture

# Once a week, Friday evening after the close (Eugenio, 2026-10-11; was
# Tue/Fri). Fundamentals move slowly and are quarterly now, so a weekly
# refresh catches every new report within a few days. Scope since 2026-10-10: the top 30 holdings by
# weight of XLF, XLV, XLK and XLP (120 names), re-read from State Street each run. Cron is UTC and does NOT auto-adjust for US
# DST. The times below assume EDT (UTC-4), in effect now. After the clock
# change to EST (UTC-5, first Sunday in November) and back to EDT (second
# Sunday in March), shift both "0 1" entries by one hour to keep the real
# capture at ~9pm ET -- see sector_fundamentals.py's module docstring.
#
# ISOLATION: this workflow only ever runs sector_fundamentals.py and only
# ever stages history/sector/* in its commit. It never touches
# intraday_state.csv, vix_state.csv, daily_metrics.csv, or rader_daily.csv
# -- those belong to the Trade Agent / Agent007 pipeline and are committed
# separately, by Eugenio, from his own machine.
#
# SOURCE, 2026-09-12: switched from SEC EDGAR to Yahoo Finance (yfinance)
# after the first live run against EDGAR was rejected with a 403 on its very
# first request -- almost certainly an IP-range block on GitHub-hosted
# runners, not fixable client-side. See sector_fundamentals.py's docstring.

on:
  schedule:
    # Fridays only (Eugenio, 2026-10-11). Sat 00:30 UTC = Fri 8:30pm EDT /
    # 7:30pm EST -- after the close either way, and ahead of the technicals
    # run (Sat 01:15 UTC) so Friday's ranking uses the fresh fundamentals.
    - cron: "30 0 * * 6"
    - cron: "30 3 * * 6"    # backup -- skips itself if the primary ran
  workflow_dispatch: {}      # lets Eugenio trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  # Joins the trading pipeline's own group (capture.yml / intraday.yml) so a
  # sector-agent push can never race theirs -- GitHub Actions serializes
  # everything in a shared group instead of letting two jobs push at once.
  # This is pure push-sequencing, not data sharing: it changes nothing about
  # which files each job touches.
  group: gex-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The second (backup) cron exists because GitHub's scheduler is
      # best-effort and drops runs. This step makes it a no-op when the
      # primary already ran: a scheduled run is skipped if the last capture
      # in history/sector/sector_fundamentals.csv is under 4 hours old. Manual runs never skip.
      - name: Skip if already captured in the last 4 hours (scheduled runs only)
        id: guard
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          import csv, os
          from datetime import datetime, timezone
          path, skip = "history/sector/sector_fundamentals.csv", False
          try:
              with open(path, newline="") as fh:
                  rows = list(csv.reader(fh))
              ts = datetime.fromisoformat(rows[-1][0].replace("Z", "+00:00"))
              age_h = (datetime.now(timezone.utc) - ts).total_seconds() / 3600
              skip = age_h < 4
              print(f"last capture {rows[-1][0]} ({age_h:.1f}h ago) -> skip={skip}")
          except Exception as e:
              print(f"no usable last capture ({e}) -> run")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install pandas numpy requests openpyxl yfinance

      - name: Run fundamentals capture
        if: steps.guard.outputs.skip != 'true'
        run: python sector_fundamentals.py --outdir history/sector

      - name: Commit and push (history/sector only)
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "sector-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history/sector
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "sector-agent: fundamentals capture $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # A local push from Eugenio's own trading-pipeline workflow can land
          # in between checkout and push; rebase onto it rather than fail --
          # the two never touch the same files, so this always resolves clean.
          git pull --rebase origin main
          git push
