name: Sector agent - technicals capture

# Daily, every weekday evening after the close (2026-10-11; was twice a
# week). Daily runs keep the gamma walls one session old at most -- open
# interest settles overnight, so a wall is only as current as the last run --
# and build the wall history that stability and respect-rate checks need.
# An hour earlier in ET from November to March, still after the close.
#
# Scope since 2026-10-10: the top 30 holdings by weight of XLF, XLV, XLK and XLP,
# 120 names, as captured by sector_fundamentals.py.
#
# Runs sector_technicals.py, then sector_candidates.py to refresh the ranked
# long/short pairs against the freshest technicals and the latest fundamentals
# capture. ISOLATION: only ever stages history/sector/* and docs/sector.html
# (the Sector Trade Monitor page) -- never touches the
# Trade Agent / Agent007 pipeline's files (intraday_state.csv, vix_state.csv,
# daily_metrics.csv, rader_daily.csv), which stay local-machine-committed.

on:
  schedule:
    # Every weekday evening after the close (Eugenio, 2026-10-11; was
    # Tue/Wed): Tue-Sat 01:15 UTC = Mon-Fri 9:15pm EDT / 8:15pm EST.
    - cron: "15 1 * * 2-6"
    - cron: "15 4 * * 2-6"  # backup -- skips itself if the primary ran
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Joins the trading pipeline's own group (capture.yml / intraday.yml) so a
  # sector-agent push can never race theirs -- intraday.yml fires every 15
  # minutes 13:30-20:15 UTC, and both of this workflow's cron times land
  # inside that window. GitHub Actions serializes everything in a shared
  # group instead of letting two jobs push at once. Pure push-sequencing,
  # not data sharing: it changes nothing about which files each job touches.
  group: gex-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The second (backup) cron exists because GitHub's scheduler is
      # best-effort and drops runs. This step makes it a no-op when the
      # primary already ran: a scheduled run is skipped if the last capture
      # in history/sector/sector_technicals.csv is under 4 hours old. Manual runs never skip.
      - name: Skip if already captured in the last 4 hours (scheduled runs only)
        id: guard
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          import csv, os
          from datetime import datetime, timezone
          path, skip = "history/sector/sector_technicals.csv", False
          try:
              with open(path, newline="") as fh:
                  rows = list(csv.reader(fh))
              ts = datetime.fromisoformat(rows[-1][0].replace("Z", "+00:00"))
              age_h = (datetime.now(timezone.utc) - ts).total_seconds() / 3600
              skip = age_h < 4
              print(f"last capture {rows[-1][0]} ({age_h:.1f}h ago) -> skip={skip}")
          except Exception as e:
              print(f"no usable last capture ({e}) -> run")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        # matplotlib: gamma_exposure.py (walls, IV) imports it at module load
        run: pip install pandas numpy requests openpyxl yfinance matplotlib

      - name: Ensure output directory exists
        if: steps.guard.outputs.skip != 'true'
        run: mkdir -p history/sector

      - name: Run technicals capture
        if: steps.guard.outputs.skip != 'true'
        run: python sector_technicals.py --outdir history/sector

      - name: Score and pair long/short candidates
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: python sector_candidates.py --outdir history/sector

      # Sector Trade Monitor page for GitHub Pages: docs/sector.html, next
      # to the GEX monitor. One self-contained HTML file, rebuilt each run;
      # it reads the candidate tables just written and adds no data files.
      - name: Build Sector Trade Monitor page
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: python build_sector_monitor.py

      - name: Commit and push (history/sector + docs/sector.html only)
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "sector-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history/sector docs/sector.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "sector-agent: technicals + candidates capture $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # A local push from Eugenio's own trading-pipeline workflow can land
          # in between checkout and push; rebase onto it rather than fail --
          # the two never touch the same files, so this always resolves clean.
          git pull --rebase origin main
          git push
